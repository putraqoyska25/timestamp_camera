name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Hapus folder android lama
        run: rm -rf android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Buat folder android baru
        run: flutter create --org com.example .

      - name: Ambil dependensi
        run: flutter pub get

      - name: Bangun APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamera-Tanda-Air
          path: build/app/outputs/flutter-apk/app-release.apk
